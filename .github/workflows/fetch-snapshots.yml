name: Fetch Camera Snapshots

on:
  schedule:
    # Run every 20 minutes
    - cron: '*/20 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  fetch-snapshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: fetch-snapshots
      cancel-in-progress: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq webp
          
      - name: Run fetch script
        run: |
          cd collector
          ./fetch-snapshots.sh
          
      # Signed commit through the API, merged through a PR (required by the branch rulesets).
      # The helper exits without a commit when nothing is staged.
      - name: Commit snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add archive/ static/images/
          bash .github/scripts/commit-signed.sh \
            "bot/snapshots-${{ github.run_id }}-${{ github.run_attempt }}" \
            "Update camera snapshots - $(date -u '+%Y-%m-%d %H:%M UTC')" \
            main
